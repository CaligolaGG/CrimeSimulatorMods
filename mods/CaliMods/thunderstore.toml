[config]
schemaVersion = "0.0.1"

[package]
# namespace and versionNumber are overridden at pack time from Directory.Build.props
# (ThunderstoreTeam) and the .csproj (<Version>), see the PackThunderstore target.
namespace = "caligola"
name = "CaliMods"
versionNumber = "1.0.0"
description = "QoL features toggled from a Custom Mods pause-menu button. Requested items get a red/yellow outline and every pickup prompt shows how many you own."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../dist"

[[build.copy]]
source = "./bin/Release/netstandard2.1/CaliMods.dll"
target = "CaliMods.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["crime-simulator"]

[publish.categories]
crime-simulator = ["mods"]
